<div id="gantt-layout-v3">
  <style>
    #gantt-layout-v3 {
      color: var(--foreground, #202124);
    }
    #gantt-layout-v3 .surface {
      border: 1px solid var(--border, #d8dbe0);
      border-radius: 12px;
      background: var(--card, #fff);
      overflow: hidden;
    }
    #gantt-layout-v3 .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border, #d8dbe0);
    }
    #gantt-layout-v3 .toolbar strong { font-size: 14px; }
    #gantt-layout-v3 .toolbar span { color: var(--muted-foreground, #687080); font-size: 11px; }
    #gantt-layout-v3 .controls { display: flex; gap: 4px; }
    #gantt-layout-v3 .controls button {
      padding: 5px 8px;
      border: 1px solid var(--border, #d8dbe0);
      border-radius: 6px;
      background: var(--card, #fff);
      color: var(--foreground, #202124);
      font-size: 11px;
    }
    #gantt-layout-v3 .chart {
      padding: 18px;
      background: var(--background, #f7f8fa);
    }
    #gantt-layout-v3 .chart-head,
    #gantt-layout-v3 .chart-row {
      display: grid;
      grid-template-columns: 170px minmax(0, 1fr);
      gap: 14px;
    }
    #gantt-layout-v3 .chart-head { align-items: end; margin-bottom: 8px; }
    #gantt-layout-v3 .range-label { color: var(--muted-foreground, #687080); font-size: 10px; }
    #gantt-layout-v3 .days {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 8px;
    }
    #gantt-layout-v3 .day {
      padding-bottom: 7px;
      border-bottom: 1px solid var(--border, #d8dbe0);
      color: var(--muted-foreground, #687080);
      font-size: 10px;
      text-align: center;
      white-space: nowrap;
    }
    #gantt-layout-v3 .rows { display: grid; gap: 9px; }
    #gantt-layout-v3 .label { min-width: 0; padding: 8px 0; }
    #gantt-layout-v3 .label strong { display: block; overflow: hidden; font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
    #gantt-layout-v3 .label span { display: block; margin-top: 4px; color: var(--muted-foreground, #687080); font-size: 10px; }
    #gantt-layout-v3 .track {
      position: relative;
      min-height: 46px;
      border-bottom: 1px solid var(--border, #d8dbe0);
      background-image: linear-gradient(to right, color-mix(in srgb, var(--border, #d8dbe0) 75%, transparent) 1px, transparent 1px);
      background-size: calc((100% - 48px) / 7 + 8px) 100%;
    }
    #gantt-layout-v3 .life {
      position: absolute;
      top: 24px;
      left: var(--left);
      width: var(--width);
      height: 3px;
      border-radius: 99px;
      background: var(--muted-foreground, #8a91a0);
      opacity: .38;
    }
    #gantt-layout-v3 .life::before,
    #gantt-layout-v3 .life::after {
      position: absolute;
      top: -3px;
      width: 9px;
      height: 9px;
      border: 2px solid var(--muted-foreground, #8a91a0);
      border-radius: 50%;
      background: var(--background, #f7f8fa);
      content: "";
    }
    #gantt-layout-v3 .life::before { left: -3px; }
    #gantt-layout-v3 .life::after { right: -3px; }
    #gantt-layout-v3 .work {
      position: absolute;
      top: 10px;
      left: var(--left);
      width: 28px;
      height: 28px;
      box-sizing: border-box;
      border: 2px solid var(--viz-series-1, #6d79dc);
      border-radius: 7px;
      background: color-mix(in srgb, var(--viz-series-1, #6d79dc) 32%, var(--card, #fff));
      cursor: pointer;
    }
    #gantt-layout-v3 .work.alt { top: 15px; border-color: var(--viz-series-2, #54a68a); background: color-mix(in srgb, var(--viz-series-2, #54a68a) 32%, var(--card, #fff)); }
    #gantt-layout-v3 .work:hover,
    #gantt-layout-v3 .work:focus-visible { outline: 3px solid color-mix(in srgb, var(--primary, #5b5bd6) 22%, transparent); }
    #gantt-layout-v3 .work::after {
      position: absolute;
      right: -4px;
      bottom: -4px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--viz-series-1, #6d79dc);
      content: "";
    }
    #gantt-layout-v3 .work.alt::after { background: var(--viz-series-2, #54a68a); }
    #gantt-layout-v3 .hover-card {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: start;
      margin: 16px 0 0 184px;
      padding: 10px 12px;
      border-left: 3px solid var(--viz-series-1, #6d79dc);
      background: var(--card, #fff);
    }
    #gantt-layout-v3 .hover-card strong { font-size: 11px; }
    #gantt-layout-v3 .hover-card span { color: var(--muted-foreground, #687080); font-size: 10px; text-align: right; }
    #gantt-layout-v3 .legend { display: flex; flex-wrap: wrap; gap: 14px; margin: 14px 0 0 184px; color: var(--muted-foreground, #687080); font-size: 10px; }
    #gantt-layout-v3 .legend i { display: inline-block; width: 20px; height: 3px; margin-right: 5px; vertical-align: middle; border-radius: 99px; background: var(--muted-foreground, #8a91a0); opacity: .45; }
    #gantt-layout-v3 .legend b { display: inline-block; width: 12px; height: 12px; margin-right: 5px; vertical-align: -2px; border: 2px solid var(--viz-series-1, #6d79dc); border-radius: 4px; background: color-mix(in srgb, var(--viz-series-1, #6d79dc) 32%, var(--card, #fff)); }
    @media (max-width: 700px) {
      #gantt-layout-v3 .chart-head, #gantt-layout-v3 .chart-row { grid-template-columns: 120px minmax(0, 1fr); gap: 10px; }
      #gantt-layout-v3 .hover-card, #gantt-layout-v3 .legend { margin-left: 130px; }
    }
  </style>

  <div class="surface">
    <div class="toolbar"><div><strong>Todo 工作跨度</strong><span>　只用圖形表達，細節交給 hover</span></div><div class="controls"><button>←</button><button>今天</button><button>→</button></div></div>
    <div class="chart">
      <div class="chart-head"><span class="range-label">開單／結單<br>實際工作紀錄</span><div class="days"><span class="day">08/17</span><span class="day">08/18</span><span class="day">08/19</span><span class="day">08/20</span><span class="day">08/21</span><span class="day">08/22</span><span class="day">08/23</span></div></div>
      <div class="rows">
        <div class="chart-row"><div class="label"><strong>金福氣</strong><span>6h 20m・跨 4 天</span></div><div class="track"><i class="life" style="--left:4%;--width:72%"></i><button class="work" style="--left:9%" data-tooltip="金福氣｜08/17 10:00–11:30｜1h 30m"></button><button class="work alt" style="--left:42%" data-tooltip="金福氣｜08/18 09:20–10:00｜40m"></button><button class="work" style="--left:68%" data-tooltip="金福氣｜08/19 11:00–13:00｜2h"></button></div></div>
        <div class="chart-row"><div class="label"><strong>日文</strong><span>4h 45m・跨 2 天</span></div><div class="track"><i class="life" style="--left:28%;--width:40%"></i><button class="work alt" style="--left:35%" data-tooltip="日文｜08/19 14:00–16:10｜2h 10m"></button><button class="work" style="--left:58%" data-tooltip="日文｜08/20 15:00–16:05｜1h 05m"></button></div></div>
        <div class="chart-row"><div class="label"><strong>研究 doc2json</strong><span>2h・實際 1 天</span></div><div class="track"><i class="life" style="--left:57%;--width:13%"></i><button class="work" style="--left:61%" data-tooltip="研究 doc2json｜08/21 13:00–15:00｜2h"></button></div></div>
      </div>
      <div class="hover-card"><div><strong>金福氣・工作紀錄</strong><br><span>08/17 10:00–11:30　／　08/18 09:20–10:00　／　08/19 11:00–13:00</span></div><span>累積 6h 20m<br>實際工作 3 天</span></div>
      <div class="legend"><span><i></i>開單到結單的生命週期</span><span><b></b>每次實際工作紀錄（hover 看時間）</span></div>
    </div>
  </div>
</div>
