<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <title>TodoTracker</title>
  <link rel="stylesheet" href="../styles/tokens.css" />
  <link rel="stylesheet" href="options.css" />
</head>
<body>
<div class="wrap">
  <header>
    <h1>TodoTracker</h1>
    <p class="cap">本機時間追蹤 · 資料存在這台瀏覽器</p>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab active" data-tab="report">報表</button>
    <button class="tab" data-tab="projects">專案</button>
    <button class="tab" data-tab="todos">Todo</button>
    <button class="tab" data-tab="schedules">排程</button>
    <button class="tab" data-tab="tags">標籤</button>
    <button class="tab" data-tab="entries">紀錄</button>
    <button class="tab" data-tab="settings">設定</button>
  </nav>

  <!-- ── 報表 ── -->
  <section id="p-report">
    <div class="toolbar">
      <div class="seg" id="range">
        <button class="seg-btn active" data-range="today">今日</button>
        <button class="seg-btn" data-range="week">本週</button>
        <button class="seg-btn" data-range="month">本月</button>
        <button class="seg-btn" data-range="all">全部</button>
      </div>
      <div class="grow"></div>
      <button id="exportCsv">↓ CSV</button>
    </div>

    <div class="kpis">
      <div class="kpi"><span class="cap">總時數</span><span id="kTime" class="num">0m</span></div>
      <div class="kpi"><span class="cap">筆數</span><span id="kCount" class="num">0</span></div>
      <div class="kpi"><span class="cap">平均每筆</span><span id="kAvg" class="num">—</span></div>
      <div class="kpi"><span class="cap">有紀錄天數</span><span id="kDays" class="num">0</span></div>
    </div>

    <h2 class="sec" data-collapse="rep-health">
      <span class="mark">[-]</span> Todo 健康度
    </h2>
    <div id="todoHealth" data-collapse-body="rep-health"></div>

    <h2 class="sec" data-collapse="rep-donut"><span class="mark">[-]</span> 專案時間分配</h2>
    <div id="byProject" data-collapse-body="rep-donut"></div>

    <h2 class="sec" data-collapse="rep-time">
      <span class="mark">[-]</span> 時間軸 <span id="timeLabel" class="mute"></span>
    </h2>
    <div id="timeline" class="chart-box scroll-x" data-collapse-body="rep-time"></div>

    <h2 class="sec" data-collapse="rep-line">
      <span class="mark">[-]</span> 每日趨勢 <span id="lineLabel" class="mute"></span>
    </h2>
    <div id="byDay" class="chart-box" data-collapse-body="rep-line"></div>
  </section>

  <!-- ── 專案 ── -->
  <section id="p-projects" hidden>
    <form id="projForm" class="card">
      <input type="hidden" id="pjId" />
      <div class="grid4">
        <label class="field"><span>名稱</span><input id="pjName" required placeholder="例：內部工具" /></label>
        <label class="field"><span>顏色</span><input id="pjColor" type="color" value="#201d1d" /></label>
        <label class="field" style="grid-column: span 2">
          <span>上層專案</span>
          <select id="pjParent"></select>
          <span class="hint">留空就是最上層。可以一直往下掛，時數會自動累加到上層。</span>
        </label>
      </div>
      <div class="actions">
        <button type="submit" class="btn-primary">儲存專案</button>
        <button type="button" id="pjCancel" hidden>取消編輯</button>
      </div>
    </form>

    <!-- 編輯某個專案時才出現：目標／筆記時間軸 -->
    <div id="pjNotesBox" class="card" hidden>
      <div class="row" style="margin-bottom:8px">
        <span class="h" id="pjNotesTitle">目標與筆記</span>
      </div>
      <textarea id="pjNoteDraft" placeholder="這個專案要達成什麼？有什麼決定或轉折？Ctrl+Enter 送出"></textarea>
      <div class="actions">
        <button type="button" id="pjNoteAdd" class="btn-primary">新增一則</button>
        <span class="cap" style="align-self:center">會記下寫入當下的時間，之後還能修改</span>
      </div>
      <div id="pjNoteList"></div>
    </div>

    <div id="projList"></div>
    <section id="projectWorkspace" class="card" hidden></section>
  </section>

  <!-- ── Todo ── -->
  <section id="p-todos" hidden>
    <form id="todoForm" class="card">
      <input type="hidden" id="tdId" />
      <div class="grid4">
        <label class="field" style="grid-column: span 2"><span>項目</span>
          <input id="tdTitle" required placeholder="要做什麼？" /></label>
        <label class="field"><span>專案</span><select id="tdProject"></select></label>
        <label class="field"><span>狀態</span>
          <select id="tdStatus">
            <option value="todo">待辦</option>
            <option value="doing">進行中</option>
            <option value="done">已完成</option>
          </select>
        </label>
      </div>
      <div class="grid4 task-parent-row" style="margin-top:12px">
        <label class="field" style="grid-column: span 2"><span>父任務</span>
          <select id="tdParent"><option value="">— 最上層任務 —</option></select>
          <span class="hint">選擇後會成為這個 Todo 的子任務。</span>
        </label>
      </div>
      <div class="grid4" style="margin-top:12px">
        <label class="field"><span>優先級</span>
          <select id="tdPriority">
            <option value="urgent">緊急</option>
            <option value="high">高</option>
            <option value="normal" selected>一般</option>
            <option value="low">低</option>
          </select>
        </label>
        <label class="field"><span>截止日</span>
          <input id="tdDue" type="date" />
          <span class="hint">唯一可以改的日期。</span>
        </label>
          <label class="field"><span>提醒時間</span>
            <input id="tdDueTime" type="time" />
            <span class="hint">到時間會發 Chrome 通知</span>
          </label>
          <span class="hint">唯一可以改的日期。</span>
        </label>
        <label class="field"><span>開單時間</span>
          <input id="tdOpened" disabled />
          <span class="hint">建立當下自動記錄，不可修改。</span>
        </label>
        <label class="field"><span>結案時間</span>
          <input id="tdDone" disabled />
          <span class="hint">按下完成的當下自動記錄；重新打開就清掉。</span>
        </label>
        <label class="field"><span>累積工時</span>
          <input id="tdWorked" disabled />
          <span class="hint">由綁在這個 todo 上的計時紀錄累加。</span>
        </label>
      </div>
      <label class="field" style="margin-top:12px"><span>備註</span>
        <textarea id="tdNotes" placeholder="細節、連結、驗收條件…"></textarea></label>
      <div class="actions">
        <button type="submit" class="btn-primary">儲存 Todo</button>
        <button type="button" id="tdCancel" hidden>取消編輯</button>
      </div>
    </form>

    <div class="toolbar">
      <select id="tdFilter" style="width:260px"></select>
      <button id="tdToggleDone">[ ] 顯示已完成</button>
      <div class="grow"></div>
      <span class="cap" id="tdCount"></span>
    </div>
    <div id="todoList"></div>
  </section>

  <!-- ── 排程 ── -->
  <section id="p-schedules" hidden>
    <p class="cap">
      設定固定週期的工作，到指定時間會自動開一張 Todo，並在快到截止時間時通知你。
      例：每個平日 09:00 開一張「填寫工作日誌」，當天 17:30 截止，提前 10 分鐘提醒。
    </p>

    <form id="schForm" class="card">
      <input type="hidden" id="scId" />
      <div class="grid4">
        <label class="field" style="grid-column: span 2"><span>要做什麼</span>
          <input id="scTitle" required placeholder="例：填寫工作日誌" /></label>
        <label class="field"><span>專案</span><select id="scProject"></select></label>
        <label class="field"><span>啟用</span>
          <select id="scEnabled">
            <option value="1">開啟</option>
            <option value="0">關閉</option>
          </select>
        </label>
      </div>

      <label class="field" style="margin-top:12px"><span>重複於</span>
        <div class="dow" id="scDow">
          <button type="button" data-dow="1">一</button>
          <button type="button" data-dow="2">二</button>
          <button type="button" data-dow="3">三</button>
          <button type="button" data-dow="4">四</button>
          <button type="button" data-dow="5">五</button>
          <button type="button" data-dow="6">六</button>
          <button type="button" data-dow="0">日</button>
          <span class="grow"></span>
          <button type="button" id="scWeekdays" class="btn-sm">平日</button>
          <button type="button" id="scEveryday" class="btn-sm">每天</button>
        </div>
      </label>

      <div class="grid4" style="margin-top:12px">
        <label class="field"><span>幾點開單</span>
          <input id="scCreate" type="time" value="09:00" />
          <span class="hint">到這個時間自動新增到 Todo。</span>
        </label>
        <label class="field"><span>當天截止時間</span>
          <input id="scDue" type="time" />
          <span class="hint">留空就不設截止。</span>
        </label>
        <label class="field"><span>提前幾分鐘提醒</span>
          <input id="scRemind" type="number" min="0" step="5" placeholder="留空不提醒" />
          <span class="hint">用 Chrome 通知，需要允許通知權限。</span>
        </label>
      </div>

      <label class="field" style="margin-top:12px"><span>備註</span>
        <textarea id="scNotes" placeholder="會一併寫進產生的 Todo"></textarea></label>

      <div class="actions">
        <button type="submit" class="btn-primary">儲存排程</button>
        <button type="button" id="scCancel" hidden>取消編輯</button>
        <button type="button" id="scRunNow">立刻檢查一次</button>
      </div>
    </form>

    <div id="schList"></div>
  </section>

  <!-- ── 標籤 ── -->
  <section id="p-tags" hidden>
    <form id="tagForm" class="card">
      <div class="grid4">
        <label class="field"><span>標籤名稱</span><input id="tgName" required placeholder="例：會議" /></label>
        <label class="field"><span>顏色</span><input id="tgColor" type="color" value="#646262" /></label>
      </div>
      <div class="actions"><button type="submit" class="btn-primary">新增標籤</button></div>
    </form>
    <div id="tagList"></div>
  </section>

  <!-- ── 紀錄 ── -->
  <section id="p-entries" hidden>
    <div class="toolbar">
      <input id="enSearch" placeholder="搜尋描述與工作紀錄…" style="width:260px" />
      <select id="enFilter" style="width:240px"></select>
      <div class="seg" id="enRange">
        <button class="seg-btn active" data-erange="all">全部</button>
        <button class="seg-btn" data-erange="month">本月</button>
        <button class="seg-btn" data-erange="week">本週</button>
        <button class="seg-btn" data-erange="today">今日</button>
      </div>
      <button id="enExpandAll" title="展開／收合所有工作紀錄">[+] 全部展開</button>
    </div>

    <div class="toolbar">
      <button id="addEntry">手動補登</button>
      <button id="copyToday">複製今日總結</button>
      <button id="copyRange">複製區間總結</button>
      <button id="exportFiltered">↓ CSV</button>
      <div class="grow"></div>
      <span class="cap" id="entryCount"></span>
    </div>

    <div id="entryList"></div>
    <div id="entryMore" style="text-align:center; padding-top:8px"></div>
  </section>

  <!-- ── 設定 ── -->
  <section id="p-settings" hidden>
    <div class="card">
      <div class="grid4">
        <label class="field">
          <span>閒置提醒（分）</span>
          <input id="stIdle" type="number" min="1" step="1" />
          <span class="hint">計時中這麼久沒碰鍵盤滑鼠（或鎖螢幕），回來時會問你這段要不要扣掉。防止忘記按停止導致時數灌水。</span>
        </label>
        <label class="field">
          <span>每筆進位（分）</span>
          <select id="stRound">
            <option value="0">不進位</option><option value="5">5</option>
            <option value="6">6</option><option value="15">15</option><option value="30">30</option>
          </select>
          <span class="hint">每筆紀錄長度往上湊到這個倍數。設 15 的話，8 分鐘會記成 15 分鐘。想要精確時數就留「不進位」。</span>
        </label>
      </div>
      <div class="actions"><button id="saveSettings" class="btn-primary">儲存設定</button></div>
    </div>

    <h2 class="sec" data-collapse="set-data"><span class="mark">[-]</span> 資料</h2>
    <div class="card" data-collapse-body="set-data">
      <p class="cap">資料只存在這台瀏覽器。換機器或重裝前記得備份。</p>
      <div class="actions">
        <button id="backup">↓ 匯出備份 JSON</button>
        <button id="restoreBtn">↑ 匯入備份</button>
        <input id="restoreFile" type="file" accept="application/json" hidden />
        <button id="wipe" class="btn-danger">[x] 清空所有資料</button>
      </div>
    </div>
  </section>
</div>

<!-- 紀錄編輯 dialog -->
<dialog id="entryDlg">
  <form method="dialog" id="entryForm">
    <h2 class="h" id="dlgTitle">編輯紀錄</h2>
    <input type="hidden" id="enId" />
    <label class="field"><span>描述</span><input id="enDesc" /></label>
    <div class="grid2">
      <label class="field"><span>專案</span><select id="enProject"></select></label>
      <label class="field"><span>Todo</span><select id="enTask"></select></label>
    </div>
    <div class="grid2">
      <label class="field"><span>開始</span><input id="enStart" type="datetime-local" /></label>
      <label class="field"><span>結束</span><input id="enEnd" type="datetime-local" /></label>
    </div>
    <label class="field"><span>工作紀錄</span>
      <textarea id="enNotes" placeholder="這段時間做了什麼？"></textarea></label>
    <div class="actions">
      <button value="cancel">取消</button>
      <button value="save" class="btn-primary">儲存</button>
    </div>
  </form>
</dialog>

<script type="module" src="options.js"></script>
</body>
</html>
